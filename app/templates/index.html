<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ProjectFlow</title>
    <link rel="stylesheet" href="/static/css/styles.css" />
</head>
<body>
    <div class="container">
        <header class="topbar">
            <div>
                <h1 data-i18n="app_title">ProjectFlow</h1>
                <p data-i18n="app_subtitle">Modern team project management</p>
            </div>
            <div style="display: flex; gap: 10px; align-items: center;">
                <select id="languageSelector" aria-label="Language">
                    <option value="th">ไทย</option>
                    <option value="en">English</option>
                </select>
                <button id="logoutBtn" class="secondary hidden" data-i18n="logout">Logout</button>
            </div>
        </header>

        <main>
            <section id="authView" class="panel auth-panel">
                <div class="auth-card">
                    <h2 data-i18n="welcome">Welcome</h2>
                    <div class="tab-switch">
                        <button class="tab active" data-tab="login" data-i18n="login">Login</button>
                        <button class="tab" data-tab="register" data-i18n="register">Register</button>
                    </div>

                    <form id="loginForm">
                        <input type="email" id="loginEmail" placeholder="Email" data-i18n-placeholder="email" required />
                        <input type="password" id="loginPassword" placeholder="Password" data-i18n-placeholder="password" required />
                        <button type="submit" data-i18n="login">Login</button>
                    </form>

                    <form id="registerForm" class="hidden">
                        <input type="text" id="registerName" placeholder="Full name" data-i18n-placeholder="full_name" required />
                        <input type="email" id="registerEmail" placeholder="Email" data-i18n-placeholder="email" required />
                        <input type="password" id="registerPassword" placeholder="Password" data-i18n-placeholder="password" required />
                        <button type="submit" data-i18n="create_account">Create account</button>
                    </form>
                </div>
            </section>

            <section id="dashboardView" class="hidden">
                <div class="stats-grid">
                    <div class="stat-card">
                        <span data-i18n="total_projects">Total Projects</span>
                        <strong id="totalProjects">0</strong>
                    </div>
                    <div class="stat-card">
                        <span data-i18n="total_tasks">Total Tasks</span>
                        <strong id="totalTasks">0</strong>
                    </div>
                    <div class="stat-card">
                        <span data-i18n="completed">Completed</span>
                        <strong id="completedTasks">0</strong>
                    </div>
                    <div class="stat-card">
                        <span data-i18n="active">Active</span>
                        <strong id="activeTasks">0</strong>
                    </div>
                </div>

                <div class="content-grid">
                    <section class="panel">
                        <h3 data-i18n="create_project">Create Project</h3>
                        <form id="projectForm">
                            <input type="text" id="projectName" placeholder="Project name" data-i18n-placeholder="project_name" required />
                            <textarea id="projectDescription" placeholder="Project description" data-i18n-placeholder="project_description"></textarea>
                            <select id="projectStatus">
                                <option value="active" data-i18n="active_status">Active</option>
                                <option value="paused" data-i18n="paused_status">Paused</option>
                                <option value="completed" data-i18n="completed_status">Completed</option>
                            </select>
                            <button type="submit" data-i18n="add_project">Add Project</button>
                        </form>
                    </section>

                    <section class="panel">
                        <h3 data-i18n="create_task">Create Task</h3>
                        <form id="taskForm">
                            <select id="taskProjectId"></select>
                            <input type="text" id="taskTitle" placeholder="Task title" data-i18n-placeholder="task_title" required />
                            <textarea id="taskDescription" placeholder="Task description" data-i18n-placeholder="task_description"></textarea>
                            <div class="inline-row">
                                <select id="taskStatus">
                                    <option value="todo" data-i18n="todo_status">Todo</option>
                                    <option value="in_progress" data-i18n="in_progress_status">In Progress</option>
                                    <option value="review" data-i18n="review_status">Review</option>
                                    <option value="done" data-i18n="done_status">Done</option>
                                </select>
                                <select id="taskPriority">
                                    <option value="low" data-i18n="low_priority">Low</option>
                                    <option value="medium" selected data-i18n="medium_priority">Medium</option>
                                    <option value="high" data-i18n="high_priority">High</option>
                                </select>
                            </div>
                            <input type="date" id="taskDueDate" />
                            <button type="submit" data-i18n="add_task">Add Task</button>
                        </form>
                    </section>
                </div>

                <section class="panel table-panel">
                    <h3 data-i18n="projects">Projects</h3>
                    <div id="projectsList" class="list-box"></div>
                </section>

                <section class="panel table-panel">
                    <h3 data-i18n="tasks">Tasks</h3>
                    <div id="tasksList" class="list-box"></div>
                </section>
            </section>
        </main>
    </div>

    <script src="/static/js/i18n.js"></script>
    <script src="/static/js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const languageSelector = document.getElementById('languageSelector');
            languageSelector.value = i18n.getLanguage();
            languageSelector.addEventListener('change', (event) => {
                i18n.setLanguage(event.target.value);
            });
        });
    </script>
</body>
</html>
