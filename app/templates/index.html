<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ProjectFlow</title>
    <link rel="stylesheet" href="/static/css/styles.css" />
</head>
<body>
    <div class="container">
        <header class="topbar">
            <div>
                <h1>ProjectFlow</h1>
                <p>Modern team project management</p>
            </div>
            <button id="logoutBtn" class="secondary hidden">Logout</button>
        </header>

        <main>
            <section id="authView" class="panel auth-panel">
                <div class="auth-card">
                    <h2>Welcome</h2>
                    <div class="tab-switch">
                        <button class="tab active" data-tab="login">Login</button>
                        <button class="tab" data-tab="register">Register</button>
                    </div>

                    <form id="loginForm">
                        <input type="email" id="loginEmail" placeholder="Email" required />
                        <input type="password" id="loginPassword" placeholder="Password" required />
                        <button type="submit">Login</button>
                    </form>

                    <form id="registerForm" class="hidden">
                        <input type="text" id="registerName" placeholder="Full name" required />
                        <input type="email" id="registerEmail" placeholder="Email" required />
                        <input type="password" id="registerPassword" placeholder="Password" required />
                        <button type="submit">Create account</button>
                    </form>
                </div>
            </section>

            <section id="dashboardView" class="hidden">
                <div class="stats-grid">
                    <div class="stat-card">
                        <span>Total Projects</span>
                        <strong id="totalProjects">0</strong>
                    </div>
                    <div class="stat-card">
                        <span>Total Tasks</span>
                        <strong id="totalTasks">0</strong>
                    </div>
                    <div class="stat-card">
                        <span>Completed</span>
                        <strong id="completedTasks">0</strong>
                    </div>
                    <div class="stat-card">
                        <span>Active</span>
                        <strong id="activeTasks">0</strong>
                    </div>
                </div>

                <div class="content-grid">
                    <section class="panel">
                        <h3>Create Project</h3>
                        <form id="projectForm">
                            <input type="text" id="projectName" placeholder="Project name" required />
                            <textarea id="projectDescription" placeholder="Project description"></textarea>
                            <select id="projectStatus">
                                <option value="active">Active</option>
                                <option value="paused">Paused</option>
                                <option value="completed">Completed</option>
                            </select>
                            <button type="submit">Add Project</button>
                        </form>
                    </section>

                    <section class="panel">
                        <h3>Create Task</h3>
                        <form id="taskForm">
                            <select id="taskProjectId"></select>
                            <input type="text" id="taskTitle" placeholder="Task title" required />
                            <textarea id="taskDescription" placeholder="Task description"></textarea>
                            <div class="inline-row">
                                <select id="taskStatus">
                                    <option value="todo">Todo</option>
                                    <option value="in_progress">In Progress</option>
                                    <option value="review">Review</option>
                                    <option value="done">Done</option>
                                </select>
                                <select id="taskPriority">
                                    <option value="low">Low</option>
                                    <option value="medium" selected>Medium</option>
                                    <option value="high">High</option>
                                </select>
                            </div>
                            <input type="date" id="taskDueDate" />
                            <button type="submit">Add Task</button>
                        </form>
                    </section>
                </div>

                <section class="panel table-panel">
                    <h3>Projects</h3>
                    <div id="projectsList" class="list-box"></div>
                </section>

                <section class="panel table-panel">
                    <h3>Tasks</h3>
                    <div id="tasksList" class="list-box"></div>
                </section>
            </section>
        </main>
    </div>

    <script src="/static/js/app.js"></script>
</body>
</html>
